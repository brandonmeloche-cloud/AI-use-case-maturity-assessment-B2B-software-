<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>B2B Software AI Use Case Maturity Assessment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      :root { --bg:#05070f; --panel:#0d1020; --panel-soft:#11162a; --line:#242b48; --text:#eff2ff; --muted:#9099c7; --lime:#d8ff3e; --teal:#44e9ca; }
      *{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%,#121a36 0%,var(--bg) 40%);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif}
      .container{width:min(1100px,96vw);margin:2rem auto 3rem} .eyebrow{color:var(--lime);font-family:'JetBrains Mono',monospace;letter-spacing:.2em;font-size:.78rem;text-transform:uppercase}
      h1{font-size:clamp(2rem,5vw,3.8rem);margin:.4rem 0 .8rem;line-height:1} h1 span{color:var(--lime)} .sub{color:var(--muted);font-family:'JetBrains Mono',monospace;line-height:1.55;max-width:75ch}
      .stats{display:grid;grid-template-columns:repeat(3,minmax(120px,1fr));gap:1rem;margin:1.5rem 0} .stat{background:rgba(13,16,32,.7);border:1px solid var(--line);border-radius:10px;padding:.9rem 1rem}
      .stat .value{color:var(--lime);font-size:1.8rem;font-weight:700} .stat .label{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:.75rem;text-transform:uppercase}
      .tabs{display:flex;overflow-x:auto;gap:.5rem;padding-bottom:.5rem;margin-bottom:1rem} .tab{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:.5rem .95rem;font-weight:500;cursor:pointer;white-space:nowrap}
      .tab.active{color:#08101d;background:var(--lime);border-color:var(--lime)} .panel{background:rgba(13,16,32,.7);border:1px solid var(--line);border-radius:14px;padding:1.2rem}
      .panel h2{margin:0 0 .2rem} .panel p{margin:0;color:var(--muted);font-family:'JetBrains Mono',monospace} .use-case-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:1rem;margin-top:1rem}
      .card{border:1px solid var(--line);border-radius:12px;background:var(--panel-soft);padding:.85rem} .card h3{margin:0 0 .4rem;font-size:1.03rem} .card p{margin:0 0 .8rem;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:.82rem}
      .score-buttons{display:flex;gap:.35rem;flex-wrap:wrap} .score-btn{border:1px solid var(--line);color:var(--muted);background:#0a0f1d;border-radius:7px;width:33px;height:33px;cursor:pointer;font-family:'JetBrains Mono',monospace}
      .score-btn.active{background:var(--teal);color:#041410;border-color:var(--teal);font-weight:700} .score-label{margin-top:.45rem;color:var(--teal);font-size:.8rem;min-height:1.2em;font-family:'JetBrains Mono',monospace}
      form{margin-top:1.5rem;display:grid;gap:.8rem} .form-row{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
      input,textarea{width:100%;background:#0a0f1d;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:.7rem .8rem;font:inherit} textarea{min-height:100px;resize:vertical}
      button[type='submit']{justify-self:start;background:var(--lime);color:#0b101b;border:0;border-radius:9px;padding:.7rem 1.1rem;font-weight:700;cursor:pointer} .status{font-family:'JetBrains Mono',monospace;font-size:.85rem}
      @media (max-width:600px){.stats{grid-template-columns:1fr}}
    </style>
  </head>
  <body>
    <main class="container">
      <header>
        <div class="eyebrow">AI Maturity Self-Assessment</div>
        <h1>B2B Software <span>AI Use Cases</span></h1>
        <p class="sub">Rate your organization’s progress on each use case from 0 (not started) to 5 (in production at scale), then submit to generate an email to Brandon.</p>
      </header>
      <section class="stats">
        <div class="stat"><div class="value" id="ratedCount">0</div><div class="label">Rated</div></div>
        <div class="stat"><div class="value" id="totalCount">0</div><div class="label">Total</div></div>
        <div class="stat"><div class="value" id="avgScore">0.0</div><div class="label">Average Score</div></div>
      </section>
      <nav class="tabs" id="tabs"></nav>
      <section class="panel"><h2 id="functionTitle"></h2><p id="functionDescription"></p><div class="use-case-grid" id="useCaseGrid"></div></section>
      <form id="submitForm">
        <div class="form-row"><input type="text" id="respondent" placeholder="Your name (optional)" /><input type="text" id="company" placeholder="Company name (optional)" /></div>
        <textarea id="notes" placeholder="Optional notes or context"></textarea>
        <button type="submit">Submit & Email Results</button>
        <div class="status" id="statusMessage"></div>
      </form>
    </main>
    <script>
      const scoreText={0:'0 — Not started',1:'1 — Exploring',2:'2 — Piloting',3:'3 — In rollout',4:'4 — Deployed',5:'5 — At scale'};
      const assessmentModel=[
        {function:'Marketing',description:'Demand generation, content, and brand performance.',useCases:['Long-form content generation','Social ad copy variants','SEO keyword clustering','Campaign performance summaries','Email nurture sequence drafting']},
        {function:'Sales',description:'Pipeline generation, qualification, and deal acceleration.',useCases:['Outbound personalization at scale','Discovery call prep briefs','Sales call note summarization','Objection handling assistants','Proposal/RFP draft generation']},
        {function:'Customer Success',description:'Retention, expansion, and proactive support.',useCases:['Health score insight generation','Renewal risk prediction','QBR narrative generation','Upsell opportunity detection','Self-serve help content creation']},
        {function:'Product & Engineering',description:'Roadmapping, development, quality, and operations.',useCases:['PRD draft generation','Code assistant usage in SDLC','Automated test case generation','Incident triage summarization','Release notes generation']},
        {function:'Finance',description:'Planning, reporting, and operational rigor.',useCases:['Forecast scenario modeling','Spend anomaly detection','Monthly close narrative summaries','Invoice/expense categorization','Board KPI package drafting']},
        {function:'People & HR',description:'Talent, enablement, and organizational effectiveness.',useCases:['Role description drafting','Candidate screening assistance','Onboarding playbook generation','Learning path recommendations','Engagement feedback analysis']},
        {function:'Legal & Compliance',description:'Contract operations, policy governance, and risk controls.',useCases:['Contract clause risk flagging','DPA/Security questionnaire drafting','Policy review assistants','Regulatory update summaries','Audit evidence organization']},
        {function:'Executive / Strategy',description:'Portfolio prioritization and cross-functional AI governance.',useCases:['AI initiative prioritization scoring','Cross-functional KPI review synthesis','Strategic planning scenario analysis','Board-ready AI update generation','ROI tracking and benefits realization']},
      ];
      const ratings={}; let activeFunctionIndex=0;
      const tabsEl=document.getElementById('tabs'), functionTitleEl=document.getElementById('functionTitle'), functionDescriptionEl=document.getElementById('functionDescription'), useCaseGridEl=document.getElementById('useCaseGrid'), ratedCountEl=document.getElementById('ratedCount'), totalCountEl=document.getElementById('totalCount'), avgScoreEl=document.getElementById('avgScore'), submitFormEl=document.getElementById('submitForm'), statusMessageEl=document.getElementById('statusMessage');
      function initializeRatings(){assessmentModel.forEach((fn)=>{ratings[fn.function]=fn.useCases.map((useCase)=>({useCase,score:null}))})}
      function getSummary(){const all=Object.values(ratings).flat();const rated=all.filter((i)=>i.score!==null);const totalScore=rated.reduce((a,i)=>a+i.score,0);return{rated:rated.length,total:all.length,average:rated.length?(totalScore/rated.length).toFixed(1):'0.0'}}
      function updateStats(){const s=getSummary();ratedCountEl.textContent=s.rated;totalCountEl.textContent=s.total;avgScoreEl.textContent=s.average}
      function renderTabs(){tabsEl.innerHTML='';assessmentModel.forEach((fn,index)=>{const btn=document.createElement('button');btn.type='button';btn.className=`tab ${index===activeFunctionIndex?'active':''}`;btn.textContent=fn.function;btn.addEventListener('click',()=>{activeFunctionIndex=index;renderTabs();renderFunctionPanel()});tabsEl.appendChild(btn)})}
      function renderFunctionPanel(){const fn=assessmentModel[activeFunctionIndex];functionTitleEl.textContent=fn.function;functionDescriptionEl.textContent=fn.description;useCaseGridEl.innerHTML='';ratings[fn.function].forEach((entry,useCaseIndex)=>{const card=document.createElement('article');card.className='card';const title=document.createElement('h3');title.textContent=entry.useCase;const desc=document.createElement('p');desc.textContent='Select your current maturity stage for this use case.';const scoreButtons=document.createElement('div');scoreButtons.className='score-buttons';for(let score=0;score<=5;score+=1){const scoreBtn=document.createElement('button');scoreBtn.type='button';scoreBtn.className=`score-btn ${entry.score===score?'active':''}`;scoreBtn.textContent=String(score);scoreBtn.addEventListener('click',()=>{ratings[fn.function][useCaseIndex].score=score;renderFunctionPanel();updateStats()});scoreButtons.appendChild(scoreBtn)}const scoreLabel=document.createElement('div');scoreLabel.className='score-label';scoreLabel.textContent=entry.score===null?'Not rated yet':scoreText[entry.score];card.append(title,desc,scoreButtons,scoreLabel);useCaseGridEl.appendChild(card)})}
      function buildEmailBody(payload){const lines=[];lines.push('AI Maturity Self-Assessment Submission');lines.push('');lines.push(`Respondent: ${payload.respondent||'Not provided'}`);lines.push(`Company: ${payload.company||'Not provided'}`);lines.push('');lines.push(`Rated Use Cases: ${payload.summary.rated}/${payload.summary.total}`);lines.push(`Average Score: ${payload.summary.average}`);lines.push('');Object.entries(payload.ratings).forEach(([functionName,entries])=>{lines.push(functionName);lines.push('-'.repeat(functionName.length));entries.forEach(({useCase,score})=>{lines.push(`- ${useCase}: ${score===null?'Not rated':score}`)});lines.push('')});if(payload.notes){lines.push('Notes');lines.push('-----');lines.push(payload.notes)}return lines.join('\n')}
      submitFormEl.addEventListener('submit',(event)=>{event.preventDefault();const payload={respondent:document.getElementById('respondent').value.trim(),company:document.getElementById('company').value.trim(),notes:document.getElementById('notes').value.trim(),summary:getSummary(),ratings};const subject=encodeURIComponent(`AI Maturity Assessment - ${payload.company||payload.respondent||'New Submission'}`);const body=encodeURIComponent(buildEmailBody(payload));window.location.href=`mailto:brandon@korza.com?subject=${subject}&body=${body}`;statusMessageEl.textContent='Opening your email client with pre-filled results...';});
      initializeRatings();renderTabs();renderFunctionPanel();updateStats();
    </script>
  </body>
</html>
