<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>B2B Software AI Use Case Maturity Assessment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      :root { --bg:#05070f; --panel:#0d1020; --panel-soft:#11162a; --line:#242b48; --text:#eff2ff; --muted:#9099c7; --lime:#d8ff3e; --teal:#44e9ca; }
      *{box-sizing:border-box}
      body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0%,#121a36 0%,var(--bg) 40%);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif}
      .container{width:min(1200px,96vw);margin:2rem auto 3rem}
      .brand-logo{display:block;width:min(160px,35vw);height:auto;margin:0 0 .9rem}.eyebrow{color:var(--lime);font-family:'JetBrains Mono',monospace;letter-spacing:.2em;font-size:.78rem;text-transform:uppercase}
      h1{font-size:clamp(2rem,5vw,3.8rem);margin:.4rem 0 .8rem;line-height:1} h1 span{color:var(--lime)}
      .sub{color:var(--muted);font-family:'JetBrains Mono',monospace;line-height:1.55;max-width:90ch}
      .stats{display:grid;grid-template-columns:repeat(3,minmax(120px,1fr));gap:1rem;margin:1.5rem 0}
      .stat{background:rgba(13,16,32,.7);border:1px solid var(--line);border-radius:10px;padding:.9rem 1rem}
      .stat .value{color:var(--lime);font-size:1.8rem;font-weight:700}
      .stat .label{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:.75rem;text-transform:uppercase}
      .tabs{display:flex;overflow-x:auto;gap:.5rem;padding-bottom:.5rem;margin-bottom:1rem}
      .tab{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:.5rem .95rem;font-weight:500;cursor:pointer;white-space:nowrap}
      .tab.active{color:#08101d;background:var(--lime);border-color:var(--lime)}
      .panel{background:rgba(13,16,32,.7);border:1px solid var(--line);border-radius:14px;padding:1.2rem}
      .panel h2{margin:0 0 .2rem}.panel p{margin:0;color:var(--muted);font-family:'JetBrains Mono',monospace}
      .rating-guidance{margin-top:.65rem;font-size:.82rem;color:var(--teal)}
      .category-block{margin-top:1rem;border-top:1px solid var(--line);padding-top:.95rem}
      .category-title{margin:0 0 .6rem;font-size:.98rem;color:var(--lime);letter-spacing:.03em;text-transform:uppercase}
      .use-case-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:.8rem}
      .card{border:1px solid var(--line);border-radius:12px;background:var(--panel-soft);padding:.8rem}
      .usecase-title{margin:0 0 .35rem;font-size:1rem;font-weight:700;line-height:1.25}
      .usecase-description{margin:0 0 .75rem;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:.78rem;line-height:1.45;font-weight:400}
      .score-buttons{display:flex;gap:.35rem;flex-wrap:wrap}
      .score-btn{border:1px solid var(--line);color:var(--muted);background:#0a0f1d;border-radius:7px;width:33px;height:33px;cursor:pointer;font-family:'JetBrains Mono',monospace}
      .score-btn.active{background:var(--teal);color:#041410;border-color:var(--teal);font-weight:700}
      .score-label{margin-top:.45rem;color:var(--teal);font-size:.78rem;min-height:1.2em;font-family:'JetBrains Mono',monospace}
      form{margin-top:1.5rem;display:grid;gap:.8rem}
      .form-row{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
      input,textarea{width:100%;background:#0a0f1d;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:.7rem .8rem;font:inherit}
      textarea{min-height:100px;resize:vertical}
      button[type='submit']{justify-self:start;background:var(--lime);color:#0b101b;border:0;border-radius:9px;padding:.7rem 1.1rem;font-weight:700;cursor:pointer}
      .status{font-family:'JetBrains Mono',monospace;font-size:.85rem}
      @media (max-width:600px){.stats{grid-template-columns:1fr}}
    </style>
  </head>
  <body>
    <main class="container">
      <header>
        <img id="brandLogo" alt="Korza logo" class="brand-logo" />
        <div class="eyebrow">AI Maturity Self-Assessment</div>
        <h1>B2B Software <span>AI Use Cases</span></h1>
        <p class="sub">Rate your organization’s progress on each use case from 0 (not started) to 5 (in production at scale), then submit.</p>
      </header>

      <section class="stats">
        <div class="stat"><div class="value" id="ratedCount">0</div><div class="label">Rated</div></div>
        <div class="stat"><div class="value" id="totalCount">0</div><div class="label">Total</div></div>
        <div class="stat"><div class="value" id="avgScore">0.0</div><div class="label">Average Score</div></div>
      </section>

      <nav class="tabs" id="tabs"></nav>

      <section class="panel">
        <h2 id="functionTitle"></h2>
        <p id="functionDescription"></p>
        <p class="rating-guidance">Choose one maturity score (0–5) for each use case below.</p>
        <div id="functionCategories"></div>
      </section>

      <form id="submitForm">
        <div class="form-row">
          <input type="text" id="respondent" placeholder="Your name (optional)" />
          <input type="text" id="company" placeholder="Company name (optional)" />
        </div>
        <textarea id="notes" placeholder="Optional notes or context"></textarea>
        <button type="submit">Submit & Email Results</button>
        <div class="status" id="statusMessage"></div>
      </form>
    </main>

      function applyTransparentLogo() {
        const logoEl = document.getElementById('brandLogo');
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);

          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const data = imageData.data;
          const logoChannel = 217;

          for (let i = 0; i < data.length; i += 4) {
            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];
            const max = Math.max(r, g, b);

            if (max === 0) {
              data[i + 3] = 0;
            } else {
              data[i] = logoChannel;
              data[i + 1] = logoChannel;
              data[i + 2] = logoChannel;
              data[i + 3] = Math.min(255, Math.round((max * 255) / logoChannel));
            }
          }

          ctx.putImageData(imageData, 0, 0);
          logoEl.src = canvas.toDataURL('image/png');
        };
        img.src = rawLogoDataUri;
      }

      const flattenUseCases = (fn) => fn.categories.flatMap((category) =>
        category.useCases.map((useCase) => ({ ...useCase, category: category.name }))
      );

      const ratings = {};
      let activeFunctionIndex = 0;

      const tabsEl = document.getElementById('tabs');
      const functionTitleEl = document.getElementById('functionTitle');
      const functionDescriptionEl = document.getElementById('functionDescription');
      const functionCategoriesEl = document.getElementById('functionCategories');
      const ratedCountEl = document.getElementById('ratedCount');
      const totalCountEl = document.getElementById('totalCount');
      const avgScoreEl = document.getElementById('avgScore');
      const submitFormEl = document.getElementById('submitForm');
      const statusMessageEl = document.getElementById('statusMessage');

      function initializeRatings() {
        assessmentModel.forEach((fn) => {
          ratings[fn.function] = flattenUseCases(fn).map((useCase) => ({
            title: useCase.title,
            description: useCase.description,
            category: useCase.category,
            score: null,
          }));
        });
      }

      function getSummary() {
        const all = Object.values(ratings).flat();
        const rated = all.filter((item) => item.score !== null);
        const totalScore = rated.reduce((acc, item) => acc + item.score, 0);
        return { rated: rated.length, total: all.length, average: rated.length ? (totalScore / rated.length).toFixed(1) : '0.0' };
      }

      function updateStats() {
        const summary = getSummary();
        ratedCountEl.textContent = summary.rated;
        totalCountEl.textContent = summary.total;
        avgScoreEl.textContent = summary.average;
      }

      function renderTabs() {
        tabsEl.innerHTML = '';
        assessmentModel.forEach((fn, index) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = `tab ${index === activeFunctionIndex ? 'active' : ''}`;
          btn.textContent = fn.function;
          btn.addEventListener('click', () => {
            activeFunctionIndex = index;
            renderTabs();
            renderFunctionPanel();
          });
          tabsEl.appendChild(btn);
        });
      }

      function renderFunctionPanel() {
        const fn = assessmentModel[activeFunctionIndex];
        const functionRatings = ratings[fn.function];

        functionTitleEl.textContent = fn.function;
        functionDescriptionEl.textContent = fn.description;
        functionCategoriesEl.innerHTML = '';

        fn.categories.forEach((category) => {
          const block = document.createElement('section');
          block.className = 'category-block';

          const heading = document.createElement('h3');
          heading.className = 'category-title';
          heading.textContent = category.name;

          const grid = document.createElement('div');
          grid.className = 'use-case-grid';

          category.useCases.forEach((useCase) => {
            const indexInRatings = functionRatings.findIndex((r) => r.title === useCase.title && r.category === category.name);
            const entry = functionRatings[indexInRatings];

            const card = document.createElement('article');
            card.className = 'card';

            const title = document.createElement('h4');
            title.className = 'usecase-title';
            title.textContent = useCase.title;

            const description = document.createElement('p');
            description.className = 'usecase-description';
            description.textContent = useCase.description;

            const scoreButtons = document.createElement('div');
            scoreButtons.className = 'score-buttons';

            for (let score = 0; score <= 5; score += 1) {
              const scoreBtn = document.createElement('button');
              scoreBtn.type = 'button';
              scoreBtn.className = `score-btn ${entry.score === score ? 'active' : ''}`;
              scoreBtn.textContent = String(score);
              scoreBtn.addEventListener('click', () => {
                ratings[fn.function][indexInRatings].score = score;
                renderFunctionPanel();
                updateStats();
              });
              scoreButtons.appendChild(scoreBtn);
            }

            const scoreLabel = document.createElement('div');
            scoreLabel.className = 'score-label';
            scoreLabel.textContent = entry.score === null ? 'Not rated yet' : scoreText[entry.score];

            card.append(title, description, scoreButtons, scoreLabel);
            grid.appendChild(card);
          });

          block.append(heading, grid);
          functionCategoriesEl.appendChild(block);
        });
      }

      function buildEmailBody(payload) {
        const lines = [];
        lines.push('AI Maturity Self-Assessment Submission');
        lines.push('');
        lines.push(`Respondent: ${payload.respondent || 'Not provided'}`);
        lines.push(`Company: ${payload.company || 'Not provided'}`);
        lines.push('');
        lines.push(`Rated Use Cases: ${payload.summary.rated}/${payload.summary.total}`);
        lines.push(`Average Score: ${payload.summary.average}`);
        lines.push('');

        Object.entries(payload.ratings).forEach(([functionName, entries]) => {
          lines.push(functionName);
          lines.push('-'.repeat(functionName.length));
          entries.forEach(({ category, title, description, score }) => {
            lines.push(`[${category}] ${title} — ${description}: ${score === null ? 'Not rated' : score}`);
          });
          lines.push('');
        });

        if (payload.notes) {
          lines.push('Notes');
          lines.push('-----');
          lines.push(payload.notes);
        }

        return lines.join('\n');
      }

      function openMailClientFallback(payload) {
        const subject = encodeURIComponent(`AI Maturity Assessment - ${payload.company || payload.respondent || 'New Submission'}`);
        const body = encodeURIComponent(buildEmailBody(payload));
        window.location.href = `mailto:brandon@korza.com?subject=${subject}&body=${body}`;
      }

      submitFormEl.addEventListener('submit', async (event) => {
        event.preventDefault();
        statusMessageEl.textContent = 'Submitting...';

        const payload = {
          respondent: document.getElementById('respondent').value.trim(),
          company: document.getElementById('company').value.trim(),
          notes: document.getElementById('notes').value.trim(),
          summary: getSummary(),
          ratings,
        };

        try {
          const response = await fetch('/api/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });

          if (!response.ok) throw new Error('API submission failed');
          statusMessageEl.textContent = 'Success! Results were emailed to Brandon.';
        } catch {
          openMailClientFallback(payload);
          statusMessageEl.textContent = 'Opened your email client as fallback (API not configured).';
        }
      });

      initializeRatings();
      renderTabs();
      renderFunctionPanel();
